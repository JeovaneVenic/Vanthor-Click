[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vanthor-bot-click"
version = "1.0.0"
description = "Automação visual local para Windows: observa regiões da tela e executa ações."
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.8",
    "numpy>=2.0",
    "mss>=9.0",
    # Linux (X11): mouse/teclado (XTest), tecla de emergência (XGrabKey) e monitores (XRandR).
    "python-xlib>=0.33; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.10", "pillow>=11"]

[project.gui-scripts]
vanthor-bot-click = "vanthor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vanthor = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
